<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Países - Viaje 2027</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
    }

    h1 {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }

    .subtitle {
      color: #aab;
      margin-bottom: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wheel-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
    }

    canvas {
      border-radius: 50%;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
    }

    .pointer {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid #ff4757;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      z-index: 10;
    }

    .center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: white;
      border: 4px solid #24243e;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      color: #24243e;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      z-index: 5;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .center-btn:hover {
      background: #ff4757;
      color: white;
      border-color: #ff4757;
      transform: translate(-50%, -50%) scale(1.08);
    }

    .center-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 25px;
      padding: 16px 40px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .result.winner {
      background: rgba(255, 71, 87, 0.25);
      border-color: rgba(255, 71, 87, 0.5);
      font-size: 2rem;
      animation: pulse 0.6s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .flag-emoji {
      font-size: 1.5em;
      margin-right: 8px;
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    @media (max-width: 560px) {
      .wheel-wrapper {
        width: 340px;
        height: 340px;
      }
      h1 { font-size: 1.4rem; }
      .result { font-size: 1.2rem; padding: 12px 24px; min-height: 50px; }
      .result.winner { font-size: 1.4rem; }
      .center-btn { width: 60px; height: 60px; font-size: 0.7rem; }
      .pointer { border-left-width: 14px; border-right-width: 14px; border-top-width: 28px; top: -18px; }
    }
  </style>
</head>
<body>
  <h1>Ruleta de Países</h1>
  <p class="subtitle">Viaje 2027 - ¿A dónde vamos?</p>

  <div class="container">
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheel" width="500" height="500"></canvas>
      <button class="center-btn" id="spinBtn" title="¡Girar!">GIRAR</button>
    </div>
  </div>

  <div class="result" id="result">Presiona GIRAR para comenzar</div>

  <script>
    (function () {
      const countries = [

        { name: "Argentina", flag: "🇦🇷" },
        { name: "Australia", flag: "🇦🇺" },
        { name: "Bahamas", flag: "🇧🇸" },
        { name: "Bangladés", flag: "🇧🇩" },
        { name: "Barbados", flag: "🇧🇧" },
        { name: "Baréin", flag: "🇧🇭" },
        { name: "Belice", flag: "🇧🇿" },
        { name: "Birmania", flag: "🇲🇲" },
        { name: "Bolivia", flag: "🇧🇴" },
        { name: "Brasil", flag: "🇧🇷" },
        { name: "Brunéi", flag: "🇧🇳" },
        { name: "Bután", flag: "🇧🇹" },
        { name: "Camboya", flag: "🇰🇭" },
        { name: "Canadá", flag: "🇨🇦" },
        { name: "Catar", flag: "🇶🇦" },
        { name: "Chile", flag: "🇨🇱" },
        { name: "China", flag: "🇨🇳" },
        { name: "Chipre", flag: "🇨🇾" },
        { name: "Colombia", flag: "🇨🇴" },
        { name: "Corea del Norte", flag: "🇰🇵" },
        { name: "Corea del Sur", flag: "🇰🇷" },
        { name: "Costa Rica", flag: "🇨🇷" },
        { name: "Cuba", flag: "🇨🇺" },
        { name: "Dominica", flag: "🇩🇲" },
        { name: "Ecuador", flag: "🇪🇨" },
        { name: "El Salvador", flag: "🇸🇻" },
        { name: "Emiratos Árabes Unidos", flag: "🇦🇪" },
        { name: "Filipinas", flag: "🇵🇭" },
        { name: "Fiyi", flag: "🇫🇯" },
        { name: "Granada", flag: "🇬🇩" },
        { name: "Guatemala", flag: "🇬🇹" },
        { name: "Guyana", flag: "🇬🇾" },
        { name: "Haití", flag: "🇭🇹" },
        { name: "Honduras", flag: "🇭🇳" },
        { name: "India", flag: "🇮🇳" },
        { name: "Indonesia", flag: "🇮🇩" },
        { name: "Irak", flag: "🇮🇶" },
        { name: "Irán", flag: "🇮🇷" },
        { name: "Islas Marshall", flag: "🇲🇭" },
        { name: "Islas Salomón", flag: "🇸🇧" },
        { name: "Israel", flag: "🇮🇱" },
        { name: "Jamaica", flag: "🇯🇲" },
        { name: "Japón", flag: "🇯🇵" },
        { name: "Jordania", flag: "🇯🇴" },

        { name: "Kiribati", flag: "🇰🇮" },
        { name: "Kuwait", flag: "🇰🇼" },
        { name: "Laos", flag: "🇱🇦" },
        { name: "Líbano", flag: "🇱🇧" },
        { name: "Malasia", flag: "🇲🇾" },
        { name: "Maldivas", flag: "🇲🇻" },
        { name: "México", flag: "🇲🇽" },
        { name: "Micronesia", flag: "🇫🇲" },
        { name: "Mongolia", flag: "🇲🇳" },
        { name: "Nauru", flag: "🇳🇷" },
        { name: "Nepal", flag: "🇳🇵" },
        { name: "Nicaragua", flag: "🇳🇮" },
        { name: "Nueva Zelanda", flag: "🇳🇿" },
        { name: "Omán", flag: "🇴🇲" },
        { name: "Pakistán", flag: "🇵🇰" },
        { name: "Palaos", flag: "🇵🇼" },
        { name: "Panamá", flag: "🇵🇦" },
        { name: "Papúa Nueva Guinea", flag: "🇵🇬" },
        { name: "Paraguay", flag: "🇵🇾" },
        { name: "Perú", flag: "🇵🇪" },
        { name: "República Dominicana", flag: "🇩🇴" },
        { name: "Samoa", flag: "🇼🇸" },
        { name: "San Cristóbal y Nieves", flag: "🇰🇳" },
        { name: "San Vicente y las Granadinas", flag: "🇻🇨" },
        { name: "Santa Lucía", flag: "🇱🇨" },
        { name: "Singapur", flag: "🇸🇬" },
        { name: "Siria", flag: "🇸🇾" },
        { name: "Sri Lanka", flag: "🇱🇰" },
        { name: "Surinam", flag: "🇸🇷" },
        { name: "Tailandia", flag: "🇹🇭" },
        { name: "Tayikistán", flag: "🇹🇯" },
        { name: "Timor Oriental", flag: "🇹🇱" },
        { name: "Tonga", flag: "🇹🇴" },
        { name: "Trinidad y Tobago", flag: "🇹🇹" },
        { name: "Turkmenistán", flag: "🇹🇲" },
        { name: "Turquía", flag: "🇹🇷" },
        { name: "Tuvalu", flag: "🇹🇻" },
        { name: "Uruguay", flag: "🇺🇾" },
        { name: "Uzbekistán", flag: "🇺🇿" },
        { name: "Vanuatu", flag: "🇻🇺" },
        { name: "Venezuela", flag: "🇻🇪" },
        { name: "Vietnam", flag: "🇻🇳" },
        { name: "Yemen", flag: "🇾🇪" },
      ];

      const n = countries.length;
      const colors = [];
      for (let i = 0; i < n; i++) {
        const hue = (i * 360) / n;
        colors.push(`hsl(${hue}, 65%, ${i % 2 === 0 ? "55%" : "45%"})`);
      }

      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const spinBtn = document.getElementById("spinBtn");
      const resultDiv = document.getElementById("result");

      const size = 500;
      const cx = size / 2;
      const cy = size / 2;
      const radius = 230;
      const textRadius = 175;

      let currentAngle = 0;
      let spinning = false;

      function drawWheel(angleOffset) {
        ctx.clearRect(0, 0, size, size);
        const sliceAngle = (2 * Math.PI) / n;

        for (let i = 0; i < n; i++) {
          const startAngle = angleOffset + i * sliceAngle;
          const endAngle = startAngle + sliceAngle;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = colors[i];
          ctx.fill();

          ctx.strokeStyle = "rgba(255,255,255,0.3)";
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(startAngle + sliceAngle / 2);
          ctx.textAlign = "right";
          ctx.fillStyle = "#fff";
          ctx.font = "bold 10px 'Segoe UI', system-ui, sans-serif";
          ctx.shadowColor = "rgba(0,0,0,0.5)";
          ctx.shadowBlur = 2;
          const name = countries[i].name;
          const displayName = name.length > 14 ? name.slice(0, 13) + "…" : name;
          ctx.fillText(displayName, textRadius, 3);
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      function getSelectedCountry(angle) {
        const sliceAngle = (2 * Math.PI) / n;
        const normalized = ((2 * Math.PI) - (angle % (2 * Math.PI))) % (2 * Math.PI);
        const index = Math.floor(normalized / sliceAngle);
        return countries[(n - index) % n];
      }

      function createConfetti() {
        const emojis = ["🎉", "🎊", "✨", "🌟", "💫", "🔥", "🎯", "✈️", "🗺️", "🌍", "🎒"];
        for (let i = 0; i < 40; i++) {
          setTimeout(() => {
            const el = document.createElement("span");
            el.className = "confetti";
            el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + "%";
            el.style.top = -(Math.random() * 40 + 10) + "px";
            el.style.fontSize = (Math.random() * 20 + 16) + "px";
            el.style.animationDuration = (Math.random() * 2 + 2) + "s";
            el.style.animationDelay = "0s";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3500);
          }, i * 30);
        }
      }

      function spin() {
        if (spinning) return;
        spinning = true;
        spinBtn.disabled = true;
        resultDiv.classList.remove("winner");
        resultDiv.textContent = "🎰 Girando...";

        const extraSpins = 5 + Math.floor(Math.random() * 5);
        const randomSlice = Math.random() * 2 * Math.PI;
        const totalRotation = extraSpins * 2 * Math.PI + randomSlice;
        const targetAngle = currentAngle + totalRotation;

        const duration = 5000;
        const startTime = performance.now();
        const startAngle = currentAngle;

        function animate(timestamp) {
          const elapsed = timestamp - startTime;
          const progress = Math.min(elapsed / duration, 1);

          const eased = 1 - Math.pow(1 - progress, 3);

          currentAngle = startAngle + totalRotation * eased;
          drawWheel(currentAngle);

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            currentAngle = targetAngle;
            drawWheel(currentAngle);
            const winner = getSelectedCountry(currentAngle);
            resultDiv.innerHTML = `<span class="flag-emoji">${winner.flag}</span> ¡${winner.name}!`;
            resultDiv.classList.add("winner");
            createConfetti();
            spinning = false;
            spinBtn.disabled = false;
          }
        }

        requestAnimationFrame(animate);
      }

      spinBtn.addEventListener("click", spin);
      drawWheel(currentAngle);

      function resizeCanvas() {
        const wrapper = document.querySelector(".wheel-wrapper");
        const w = Math.min(wrapper.clientWidth, 500);
        const ratio = w / 500;
        canvas.style.width = w + "px";
        canvas.style.height = w + "px";
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
    })();
  </script>
</body>
</html>
