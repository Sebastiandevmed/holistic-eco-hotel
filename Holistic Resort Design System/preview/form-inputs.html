<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bone)}
  .card{padding:20px 26px;color:var(--ink);font-family:var(--font-body)}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;max-width:680px}
  .field label{display:block;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--stone);font-weight:600;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;font-family:var(--font-body);font-size:15px;padding:12px 14px;border:1px solid rgba(42,37,32,0.18);background:#fff;border-radius:8px;color:var(--ink);box-sizing:border-box;transition:border-color 200ms,box-shadow 200ms}
  .field input:focus,.field textarea:focus{outline:none;border-color:#C68A3C;box-shadow:0 0 0 3px rgba(198,138,60,0.18)}
  .field.err input{border-color:#A14E2A}
  .field .help{font-size:11.5px;color:var(--stone);margin-top:4px}
  .field.err .help{color:#A14E2A}
  .field input::placeholder{color:#B8987A}
  .check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
  .check i{width:18px;height:18px;border:1.5px solid #7A6B58;border-radius:4px;display:inline-block;position:relative}
  .check.on i{background:#4E5B3C;border-color:#4E5B3C}
  .check.on i::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Component · Form inputs</div>
  <div class="grid">
    <div class="field">
      <label>Nombre</label>
      <input value="María Restrepo" />
    </div>
    <div class="field">
      <label>Email</label>
      <input value="maria@ejemplo.com" />
    </div>
    <div class="field err">
      <label>Teléfono</label>
      <input value="3142" />
      <div class="help">Ingresa un número válido — al menos diez dígitos.</div>
    </div>
    <div class="field">
      <label>Llegada</label>
      <input placeholder="dd / mm / aaaa" />
    </div>
    <div class="field" style="grid-column:span 2">
      <label>Mensaje</label>
      <textarea rows="2" placeholder="Cuéntanos sobre tu estancia ideal…"></textarea>
    </div>
    <label class="check on"><i></i><span>Quiero recibir novedades de Holistic — una vez al mes, no más.</span></label>
  </div>
</div>
</body></html>
