<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Night palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#05070E}
  .card{padding:22px 24px;font-family:var(--font-body);color:#ECE3CF}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:84px;border-radius:10px;border:1px solid rgba(236,227,207,0.10);position:relative;overflow:hidden}
  .chip.glow{box-shadow:inset 0 0 24px rgba(244,236,207,0.12)}
  .name{font-size:11px;letter-spacing:0.06em;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:#B4AA90}
  .role{font-size:10.5px;color:#B4AA90}
  h4{font-family:var(--font-display);font-weight:400;margin:0 0 14px;font-size:18px;letter-spacing:0.005em;color:#F4ECCF}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#B4AA90;margin-bottom:4px;font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Foundation · 04 · Night</div>
  <h4>Deep indigo night, candle-cream moonlight type</h4>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#05070E"></div><div class="name">Midnight</div><div class="hex">#05070E</div></div>
    <div class="sw"><div class="chip" style="background:#0E1428"></div><div class="name">Indigo</div><div class="hex">#0E1428</div></div>
    <div class="sw"><div class="chip" style="background:#2A3450"></div><div class="name">Twilight</div><div class="hex">#2A3450</div></div>
    <div class="sw"><div class="chip" style="background:#ECE3CF"></div><div class="name" style="color:#05070E;text-shadow:none">Silver</div><div class="hex">#ECE3CF</div></div>
    <div class="sw"><div class="chip glow" style="background:#F4ECCF"></div><div class="name" style="color:#05070E">Moon</div><div class="hex">#F4ECCF</div></div>
  </div>
</div>
</body></html>
