<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Night palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#0B0F1A}
  .card{padding:22px 24px;font-family:var(--font-body);color:#D4DCEB}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:84px;border-radius:10px;border:1px solid rgba(212,220,235,0.10);position:relative;overflow:hidden}
  .chip.glow{box-shadow:inset 0 0 24px rgba(242,232,200,0.12)}
  .name{font-size:11px;letter-spacing:0.06em;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:#98A3BA}
  .role{font-size:10.5px;color:#98A3BA}
  h4{font-family:var(--font-display);font-weight:400;margin:0 0 14px;font-size:18px;letter-spacing:0.005em;color:#F2E8C8}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#98A3BA;margin-bottom:4px;font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Foundation · 04 · Night</div>
  <h4>Indigo, twilight, silver moonlight, candle amber</h4>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0B0F1A"></div><div class="name">Midnight</div><div class="hex">#0B0F1A</div></div>
    <div class="sw"><div class="chip" style="background:#1A2440"></div><div class="name">Indigo</div><div class="hex">#1A2440</div></div>
    <div class="sw"><div class="chip" style="background:#3D4A6B"></div><div class="name">Twilight</div><div class="hex">#3D4A6B</div></div>
    <div class="sw"><div class="chip" style="background:#D4DCEB"></div><div class="name" style="color:#0B0F1A;text-shadow:none">Silver</div><div class="hex">#D4DCEB</div></div>
    <div class="sw"><div class="chip glow" style="background:#F2E8C8"></div><div class="name" style="color:#0B0F1A">Moon</div><div class="hex">#F2E8C8</div></div>
  </div>
</div>
</body></html>
