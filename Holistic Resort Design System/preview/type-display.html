<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Display · Italiana</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bone)}
  .card{padding:22px 26px;color:var(--ink)}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--stone);font-weight:500}
  .wm{font-family:var(--font-brand);font-weight:400;font-size:72px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink);line-height:1;margin:14px 0 4px}
  .tag{font-family:var(--font-body);font-size:10px;letter-spacing:0.45em;text-transform:uppercase;font-weight:500;color:var(--stone);margin:0 0 18px}
  .glyphs{font-family:var(--font-brand);font-weight:400;font-size:30px;color:var(--clay);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 14px}
  .meta{display:flex;gap:18px;font-family:var(--font-body);font-size:11px;color:var(--stone);letter-spacing:0.04em;flex-wrap:wrap}
  .meta b{color:var(--ink);font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Typography · 01 · Brand display</div>
  <div class="wm">Holistic</div>
  <div class="tag">Eco · Hotel</div>
  <div class="glyphs">A B C · 0 1 2 3 · Q æ ñ &amp;</div>
  <div class="meta">
    <span><b>Italiana</b></span>
    <span>1 weight · 400 only</span>
    <span>no italic</span>
    <span>tracking 0.04em (hero) → 0.18em (wordmark)</span>
    <span>Use only for the wordmark + hero "Holistic"</span>
  </div>
</div>
</body></html>
