<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Time of day</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bone)}
  .card{padding:18px 22px;color:var(--ink);font-family:var(--font-body)}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .frame{aspect-ratio:16/8;border-radius:14px;overflow:hidden;position:relative;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
  .day{background-image:url('../assets/Hero.jpg')}
  .night{background-image:url('../assets/HeroNight.jpg')}
  .scrim{position:absolute;inset:0;pointer-events:none}
  .day .scrim{background:linear-gradient(135deg,rgba(198,138,60,0.18),rgba(0,0,0,0.0) 50%,rgba(0,0,0,0.45))}
  .night .scrim{background:linear-gradient(135deg,rgba(26,36,64,0.45),rgba(0,0,0,0.0) 45%,rgba(0,0,0,0.55))}
  .title{position:relative;font-family:var(--font-italic);font-style:italic;font-weight:300;font-size:34px;color:#fff;letter-spacing:0.005em;text-shadow:0 1px 12px rgba(0,0,0,0.35);max-width:80%;line-height:1.05}
  .badge{position:absolute;top:14px;right:14px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;padding:6px 12px;border-radius:999px;backdrop-filter:blur(12px) saturate(160%);display:inline-flex;align-items:center;gap:6px}
  .day .badge{background:rgba(246,241,231,0.7);color:#2A2520}
  .night .badge{background:rgba(11,15,26,0.55);color:#F2E8C8;border:1px solid rgba(242,232,200,0.25)}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Pattern · Time-of-day hero · auto-switch at 18:00</div>
  <div class="grid">
    <div class="frame day">
      <div class="scrim"></div>
      <span class="badge">☀️ Bienvenido de día</span>
      <div class="title">Donde la naturaleza te abraza</div>
    </div>
    <div class="frame night">
      <div class="scrim"></div>
      <span class="badge">🌙 Buenas noches</span>
      <div class="title">La noche también es para soñar</div>
    </div>
  </div>
</div>
</body></html>
