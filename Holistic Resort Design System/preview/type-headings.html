<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Headings · Cormorant Garamond</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bone)}
  .card{padding:22px 26px;color:var(--ink)}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:14px}
  h2{font-family:var(--font-display);font-weight:300;font-size:48px;line-height:1.02;letter-spacing:-0.004em;margin:0 0 8px;text-wrap:balance;max-width:560px;color:var(--ink)}
  h2 em{font-family:var(--font-italic);font-style:italic;font-weight:300;color:var(--moss)}
  .lead{font-family:var(--font-italic);font-style:italic;font-weight:300;font-size:22px;line-height:1.4;color:var(--stone);max-width:520px;margin:0 0 14px}
  .row{display:flex;gap:14px;align-items:baseline;margin-top:14px;flex-wrap:wrap}
  .row span{font-family:var(--font-display);font-size:26px;color:var(--ink)}
  .meta{display:flex;gap:18px;font-family:var(--font-body);font-size:11px;color:var(--stone);letter-spacing:0.04em;flex-wrap:wrap;margin-top:14px}
  .meta b{color:var(--ink);font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Typography · 02 · Headings & italic voice</div>
  <h2>Donde la naturaleza <em>te abraza</em></h2>
  <div class="lead">— Una pausa entre el verde.</div>
  <div class="row">
    <span style="font-weight:300">Light 300</span>
    <span style="font-weight:300;font-style:italic">Light italic</span>
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:400;font-style:italic">Italic 400</span>
  </div>
  <div class="meta">
    <span><b>Cormorant Garamond</b></span>
    <span>2 weights · 300, 400 (both with true italics)</span>
    <span>h1–h4 · lead · quotes · em inside body</span>
  </div>
</div>
</body></html>
