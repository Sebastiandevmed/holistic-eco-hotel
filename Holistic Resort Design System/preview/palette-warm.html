<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Warm neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bone)}
  .card{padding:22px 24px;font-family:var(--font-body);color:var(--ink)}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:78px;border-radius:10px;border:1px solid var(--border);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05)}
  .name{font-size:11px;letter-spacing:0.06em;font-weight:600;color:var(--ink)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--stone)}
  h4{font-family:var(--font-display);font-weight:400;margin:0 0 14px;font-size:18px;letter-spacing:0.005em;color:var(--ink)}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--stone);margin-bottom:4px;font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Foundation · 01</div>
  <h4>Warm neutrals — plaster, straw, clay, ink</h4>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#F6F1E7"></div><div class="name">Bone</div><div class="hex">#F6F1E7</div></div>
    <div class="sw"><div class="chip" style="background:#ECE3D2"></div><div class="name">Linen</div><div class="hex">#ECE3D2</div></div>
    <div class="sw"><div class="chip" style="background:#D9C7A7"></div><div class="name">Sand</div><div class="hex">#D9C7A7</div></div>
    <div class="sw"><div class="chip" style="background:#B8987A"></div><div class="name">Clay</div><div class="hex">#B8987A</div></div>
    <div class="sw"><div class="chip" style="background:#7A6B58"></div><div class="name" style="color:#F6F1E7;padding-left:4px;margin-top:-22px;text-shadow:0 1px 2px rgba(0,0,0,.3)">Stone</div><div class="hex">#7A6B58</div></div>
    <div class="sw"><div class="chip" style="background:#2A2520"></div><div class="hex" style="color:#7A6B58">Ink</div><div class="hex">#2A2520</div></div>
    <div class="sw"><div class="chip" style="background:#1A1714"></div><div class="hex" style="color:#7A6B58">Charcoal</div><div class="hex">#1A1714</div></div>
  </div>
</div>
</body></html>
