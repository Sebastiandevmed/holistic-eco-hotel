<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Warm accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bone)}
  .card{padding:22px 24px;font-family:var(--font-body);color:var(--ink)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:84px;border-radius:10px;border:1px solid var(--border);box-shadow:0 1px 1px rgba(0,0,0,0.04)}
  .name{font-size:11px;letter-spacing:0.06em;font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--stone)}
  .role{font-size:10.5px;color:var(--stone)}
  h4{font-family:var(--font-display);font-weight:400;margin:0 0 14px;font-size:18px;letter-spacing:0.005em}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--stone);margin-bottom:4px;font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Foundation · 03</div>
  <h4>Warm accents — candle, clay, sunset, metal</h4>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#C68A3C"></div><div class="name">Amber</div><div class="hex">#C68A3C</div><div class="role">Primary CTA · day</div></div>
    <div class="sw"><div class="chip" style="background:#D4A857"></div><div class="name">Gold</div><div class="hex">#D4A857</div><div class="role">Metallic shimmer · logo</div></div>
    <div class="sw"><div class="chip" style="background:#A14E2A"></div><div class="name">Terracotta</div><div class="hex">#A14E2A</div><div class="role">Alert · pop</div></div>
    <div class="sw"><div class="chip" style="background:#C97B5C"></div><div class="name">Coral</div><div class="hex">#C97B5C</div><div class="role">Sunset · secondary</div></div>
  </div>
</div>
</body></html>
