<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Badges & tags</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bone)}
  .card{padding:22px 26px;color:var(--ink);font-family:var(--font-body)}
  .eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--stone);min-width:80px}
  .b{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;padding:5px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .b-brand{background:rgba(78,91,60,0.12);color:#2E3A28}
  .b-accent{background:rgba(198,138,60,0.16);color:#7C5320}
  .b-danger{background:rgba(161,78,42,0.14);color:#A14E2A}
  .b-neutral{background:#ECE3D2;color:#7A6B58}
  .b-outline{background:transparent;border:1px solid rgba(42,37,32,0.24);color:#2A2520}
  .b-night{background:rgba(242,232,200,0.10);color:#F2E8C8;border:1px solid rgba(242,232,200,0.25)}
  .scrim{background:#05070E;padding:14px 18px;border-radius:10px;display:inline-flex;gap:10px}
  .b i{width:6px;height:6px;border-radius:99px;background:currentColor;display:inline-block}
  .chip{font-family:var(--font-body);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--border);padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .chip svg{width:14px;height:14px;stroke:var(--moss);stroke-width:1.5;fill:none}
</style></head>
<body>
<div class="card">
  <div class="eyebrow">Component · Badges & tags</div>
  <div class="row"><span class="lbl">Status</span>
    <span class="b b-brand"><i></i>Disponible</span>
    <span class="b b-accent"><i></i>Solo quedan 3</span>
    <span class="b b-danger"><i></i>Reservado</span>
    <span class="b b-neutral">Eco · Hotel</span>
  </div>
  <div class="row"><span class="lbl">Outline</span>
    <span class="b b-outline">Wellness</span>
    <span class="b b-outline">All inclusive</span>
    <span class="b b-outline">Adults only · 16+</span>
  </div>
  <div class="row"><span class="lbl">Night</span>
    <div class="scrim"><span class="b b-night"><i></i>Buenas noches</span><span class="b b-night">Cena 19:00 – 22:30</span></div>
  </div>
  <div class="row"><span class="lbl">Amenity chips</span>
    <span class="chip"><svg viewBox="0 0 24 24"><path d="M2 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>Piscina</span>
    <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 12h18M6 8v8M18 8v8"/></svg>Cama doble</span>
    <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 3c4 6 4 12 0 18-4-6-4-12 0-18z"/></svg>Spa</span>
  </div>
</div>
</body></html>
