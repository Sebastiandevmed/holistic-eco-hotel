<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holistic Eco · Hotel — Un retiro entre árboles</title>
  <meta name="description" content="Holistic Eco·Hotel: una sola cabaña entre los árboles, zonas comunes y piscina de día y de noche. Cinco hectáreas de selva en Mariquita, Tolima.">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
    body { font-family: var(--font-body); transition: background 600ms var(--ease-organic), color 600ms var(--ease-organic); }
    * { box-sizing: border-box; }
    a { color: inherit; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- GSAP — scroll-driven parallax + reveals (loads before the Babel components) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="parallax.jsx"></script>
<script type="text/babel" src="siteShell.jsx"></script>
<script type="text/babel" src="SplashIntro.jsx"></script>
<script type="text/babel" src="Navbar.jsx"></script>
<script type="text/babel" src="HeroSection.jsx"></script>
<script type="text/babel" src="WelcomeSection.jsx"></script>
<script type="text/babel" src="HomeTeasers.jsx"></script>
<script type="text/babel" src="BarSection.jsx"></script>
<script type="text/babel" src="PublicationsSection.jsx"></script>
<script type="text/babel" src="CommunitySection.jsx"></script>
<script type="text/babel" src="PromoPopup.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const [mode, setMode] = useTimeMode();
    const replaySplash = new URLSearchParams(location.search).get('splash') === 'replay';
    if (replaySplash) sessionStorage.removeItem('holistic-splash-seen');

    const [splashDone, setSplashDone] = useState(
      sessionStorage.getItem('holistic-splash-seen') === '1'
    );

    useEffect(() => {
      document.body.style.overflow = splashDone ? '' : 'hidden';
      return () => { document.body.style.overflow = ''; };
    }, [splashDone]);

    return (
      <>
        {!splashDone && <SplashIntro mode={mode} onDone={() => setSplashDone(true)} />}
        <Navbar mode={mode} />
        <HeroSection forceMode={mode} />
        <WelcomeSection />
        <HomeTeasers />
        <BarSection />
        <PublicationsSection />
        <CommunitySection />
        <Footer />
        <PromoPopup active={splashDone} />
        <ModeSwitch
          mode={mode}
          setMode={setMode}
          onReplaySplash={() => { sessionStorage.removeItem('holistic-splash-seen'); setSplashDone(false); }}
        />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
