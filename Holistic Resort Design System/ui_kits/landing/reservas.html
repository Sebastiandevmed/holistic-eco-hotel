<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas — Holistic Eco · Hotel</title>
  <meta name="description" content="Reserva tu cabaña en Holistic Eco·Hotel. Desde $480 / noche. Disponibilidad en línea por LobbyPMS o contacto directo por WhatsApp.">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bone); color: var(--ink); overflow-x: hidden; }
    body { font-family: var(--font-body); }
    * { box-sizing: border-box; }
    a { color: inherit; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="siteShell.jsx"></script>
<script type="text/babel" src="Navbar.jsx"></script>
<script type="text/babel" src="CtaSection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
  // What's included + price recap, with the two reservation paths.
  function ReservasInfo() {
    const amenities = [
      'Ducha y bañera dentro de la cabaña',
      'Aire acondicionado',
      'Wifi de fibra óptica',
      'Cafetera y minibar',
      'Vista directa a la selva',
      'Ropa de cama de lino',
    ];
    return (
      <section style={{ background: 'var(--bone)', padding: 'clamp(56px, 9vw, 112px) 24px' }}>
        <div className="res-grid" style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 40, alignItems: 'start' }}>
          <div>
            <SectionHeading
              eyebrow="Reservar"
              title="Una cabaña, dos formas de reservar."
              lead="Reserva en línea con disponibilidad en tiempo real, o escríbenos por WhatsApp y te ayudamos con las fechas."
            />
            <ul style={{ listStyle: 'none', margin: '28px 0 0', padding: 0, display: 'grid', gap: 12 }}>
              {amenities.map((a) => (
                <li key={a} style={{ display: 'flex', gap: 10, alignItems: 'center', fontFamily: 'var(--font-body)', fontSize: 15, color: 'var(--ink)' }}>
                  <span style={{ color: 'var(--moss)', display: 'inline-flex', flex: '0 0 auto' }}><IconLucide d="M20 6L9 17l-5-5" size={18} /></span>
                  {a}
                </li>
              ))}
            </ul>
          </div>

          <aside style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', padding: '30px 28px', boxShadow: 'var(--shadow-2)' }}>
            <div style={{ fontFamily: 'var(--font-body)', fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--fg-muted)', fontWeight: 600 }}>La cabaña</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--fg-muted)', display: 'flex', gap: 10, flexWrap: 'wrap', margin: '10px 0 18px' }}>
              <span>2 huéspedes</span><span style={{ opacity: 0.4 }}>·</span><span>38 m²</span><span style={{ opacity: 0.4 }}>·</span><span>1 cama king</span>
            </div>
            <div style={{ height: 1, background: 'var(--divider, var(--border))', margin: '0 0 18px' }} />
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 22 }}>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--fg-muted)' }}>desde</span>
              <span style={{ fontFamily: 'var(--font-display)', fontSize: 40, fontWeight: 400, color: 'var(--ink)' }}>$480</span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--fg-muted)' }}>/ noche</span>
            </div>
            <div style={{ display: 'grid', gap: 12 }}>
              <ReserveButton variant="primary">Reservar en línea</ReserveButton>
              <Button variant="secondary" href={WHATSAPP_URL} target="_blank" rel="noopener noreferrer" arrow={false}>Escríbenos por WhatsApp</Button>
            </div>
            <p style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--fg-muted)', margin: '16px 0 0', lineHeight: 1.5 }}>
              La reserva en línea abre el motor de LobbyPMS en una pestaña nueva.
            </p>
          </aside>
        </div>
        <style>{`@media (max-width: 820px) { .res-grid { grid-template-columns: 1fr !important; } }`}</style>
      </section>
    );
  }

  function App() {
    const [mode, setMode] = useTimeMode();
    return (
      <>
        <Navbar mode={mode} />
        <PageHero
          eyebrow="Reservar"
          title="Reservas"
          lead="Disponibilidad, tarifas y contacto directo."
          image="../../assets/HeroNight.jpg"
          mode={mode}
        />
        <ReservasInfo />
        <CtaSection />
        <Footer />
        <ModeSwitch mode={mode} setMode={setMode} />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
