<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería — Holistic Eco · Hotel</title>
  <meta name="description" content="Galería de Holistic Eco·Hotel: la cabaña por dentro y por fuera, las zonas comunes y la piscina de día y de noche.">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bone); color: var(--ink); overflow-x: hidden; }
    body { font-family: var(--font-body); }
    * { box-sizing: border-box; }
    a { color: inherit; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="siteShell.jsx"></script>
<script type="text/babel" src="Navbar.jsx"></script>
<script type="text/babel" src="PoolAndVillas.jsx"></script>
<script type="text/babel" src="LobbyBeforeAfter.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
  // Cabin photo grid (interiors + exteriors of the single cabin).
  function CabinGallery() {
    const photos = ['Room1.jpg', 'Room5.jpg', 'Room8.jpg', 'Room2.jpg', 'Room7.jpg', 'Room4.jpg', 'RoomOut.jpg', 'RoomOut2.jpg', 'Room6.jpg'];
    return (
      <section style={{ background: 'var(--bone)', padding: 'clamp(56px, 9vw, 112px) 24px 64px' }}>
        <div style={{ maxWidth: 1280, margin: '0 auto 40px' }}>
          <SectionHeading
            eyebrow="01 · La cabaña"
            title="Por dentro y por fuera."
            lead="La misma cabaña para todos: dormitorio, baño con ducha y bañera, y su lugar entre los árboles."
          />
        </div>
        <div style={{ maxWidth: 1280, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16 }} className="gal-grid">
          {photos.map((src, i) => (
            <figure key={i} style={{ margin: 0, borderRadius: 14, overflow: 'hidden', aspectRatio: '4 / 3', boxShadow: 'var(--shadow-1)', cursor: 'zoom-in', transition: 'transform 380ms var(--ease-organic), box-shadow 380ms' }}
              onMouseEnter={(e) => { e.currentTarget.style.transform = 'scale(1.03)'; e.currentTarget.style.boxShadow = 'var(--shadow-3)'; }}
              onMouseLeave={(e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = 'var(--shadow-1)'; }}>
              <img src={'../../assets/' + src} alt="La cabaña" loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
            </figure>
          ))}
        </div>
        <style>{`@media (max-width: 720px) { .gal-grid { grid-template-columns: 1fr 1fr !important; } }`}</style>
      </section>
    );
  }

  function App() {
    const [mode, setMode] = useTimeMode();
    return (
      <>
        <Navbar mode={mode} />
        <PageHero
          eyebrow="Fotos"
          title="Galería"
          lead="La cabaña, las zonas comunes y la piscina — de día y de noche."
          image="../../assets/Pool.jpg"
          mode={mode}
        />
        <CabinGallery />
        <PoolMasonry />
        <LobbyBeforeAfter />
        <Footer />
        <ModeSwitch mode={mode} setMode={setMode} />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
